<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 stop</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
<style>
  .stop { font-size: 172px; }
  .went { font-size: 112px; margin-top: 70px; }
  .free { font-size: 340px; letter-spacing: -0.05em; line-height: 0.9; margin-top: 18px; text-shadow: 0 0 80px rgba(255, 60, 60, 0.55); }
</style>
</head>
<body class="red">
<main class="safe center">
  <div class="h stop">STOPPP <span class="emoji">✋</span></div>
  <div class="h went">wisp just went</div>
  <div class="h free">FREE</div>
</main>
<script>
// STOPPP slams in, the hand waves, FREE rises in solid 3D with a camera thud.
WispAnim.slide((k) => {
  const [stopWord] = k.words(".stop", true);
  const hand = k.$(".stop .emoji");
  hand.style.display = "inline-block";
  k.slam(stopWord, -0.08, { from: 2.1, dur: 0.42 }); // already mid-slam on frame 0
  k.kick(".safe", 0.2, 10);
  k.pop(hand, 0.16, { from: 0.4, rot: -30, y: 0, dur: 0.6, ease: "bouncy" });
  k.idle(hand, ["rotate(-8deg)", "rotate(8deg)"], 0.6, 0.66);
  k.stagger(k.words(".went", true), 0.28, 0.07, (w, t) => k.pop(w, t));
  const free = k.extrude(".free", { layers: 16, step: 2.2, from: "ff6b6b", to: "3a0a10" });
  k.A(".free", [{ opacity: 0 }, { opacity: 1 }], 0.44, 0.18, "out");
  k.A(free, [{ transform: `${k.P(1100)} translateY(60px) translateZ(-320px) rotateX(-38deg)` }, { transform: `${k.P(1100)} translateY(0px) translateZ(0px) rotateX(0deg)` }], 0.44, 0.55, "spring");
  k.kick(".safe", 0.58, 14);
  k.idle(free, ["rotateY(-8deg) rotateX(4deg)", "rotateY(8deg) rotateX(-3deg)"], 1.4, 1.0);
});
</script>
</body>
</html>
