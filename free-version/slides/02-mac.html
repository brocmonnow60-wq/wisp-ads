<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 mac</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
<style>
  .q { font-size: 150px; }
  .q .emoji { display: block; font-size: 230px; margin-top: 60px; line-height: 1; }
</style>
</head>
<body>
<main class="safe center">
  <div class="h q">do you have a&nbsp;Mac? <span class="emoji">💻</span></div>
</main>
<script>
// Words pop one by one, the laptop turns in and floats.
WispAnim.slide((k) => {
  k.punch();
  const emoji = k.$(".q .emoji");
  const ws = k.words(".q", true).filter((w) => !w.closest(".emoji"));
  k.stagger(ws, 0, 0.08, (w, t, i) => k.pop(w, t, { rot: i % 2 ? 5 : -5 }));
  k.A(emoji, [{ transform: `${k.P(900)} rotateY(-160deg) scale(.6)`, opacity: 0 }, { opacity: 1, offset: 0.4 }, { transform: `${k.P(900)} rotateY(0deg) scale(1)`, opacity: 1 }], 0.14, 0.64, "out");
  k.idle(emoji, ["translateY(-10px) rotate(-3deg)", "translateY(10px) rotate(3deg)"], 1.2, 0.85);
});
</script>
</body>
</html>
