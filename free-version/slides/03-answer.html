<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 answer</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
</head>
<body>
<main class="safe demo">
  <div class="chips"><span class="chip"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h8A2.5 2.5 0 0 1 16 6.5v4a2.5 2.5 0 0 1-2.5 2.5H9l-3.5 3v-3A2.5 2.5 0 0 1 3 10.5z"/><path d="M16 9h2.5a2.5 2.5 0 0 1 2.5 2.5v4a2.5 2.5 0 0 1-2.5 2.5H18v3l-3.5-3h-3A2.5 2.5 0 0 1 9 15.5V15"/></svg>Answer <kbd>⌃1</kbd></span></div>
  <div class="caption">highlight anything <span class="v">→</span> answer right&nbsp;there</div>
  <div class="stage">
    <div class="page">
      <div class="skel title" style="width: 58%"></div>
      <div class="skel" style="width: 100%"></div>
      <div class="skel" style="width: 86%"></div>
      <div class="sel">What's the difference between mitosis and meiosis?</div>
      <div class="skel" style="width: 94%"></div>
      <div class="skel" style="width: 64%"></div>
    </div>
    <div class="panel">
      <div class="label"><span class="spark">✦</span> wisp</div>
      <div class="answer" data-answer>Mitosis makes 2 identical cells for growth and repair. Meiosis makes 4 cells with half the chromosomes, which become eggs or sperm.</div>
    </div>
  </div>
</main>
<script>
// Chip swings in, the page flies up in 3D, a crosshair drags the capture box,
// and the answer panel pops out of the selection while the answer streams in.
WispAnim.slide((k) => {
  k.punch();
  k.chipIn(0.02);
  k.stagger(k.words(".caption", true), 0.12, 0.045, (w, t) => k.pop(w, t, { from: 0.4, y: 40 }));
  k.fly3d(".page", 0.16);
  const end = k.drag(".sel", 0.58, 0.34);
  k.panelIn(".panel", end + 0.04);
  k.stream(".answer", end + 0.2, 0.45);
});
</script>
</body>
</html>
