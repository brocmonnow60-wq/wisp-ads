<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 translate</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
<style>
  .sel { font-size: 54px; }
  .answer { font-size: 58px; }
</style>
</head>
<body>
<main class="safe demo">
  <div class="chips"><span class="chip"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3h13A2.5 2.5 0 0 1 21 5.5v9a2.5 2.5 0 0 1-2.5 2.5H15l-3 3.5L9 17H5.5A2.5 2.5 0 0 1 3 14.5v-9A2.5 2.5 0 0 1 5.5 3z"/><path d="M8.5 13.5 12 6l3.5 7.5M9.8 11h4.4"/></svg>Translate <kbd>⌃3</kbd></span><span class="pill">full version</span></div>
  <div class="stage">
    <div class="page">
      <div class="skel title" style="width: 52%"></div>
      <div class="skel" style="width: 100%"></div>
      <div class="skel" style="width: 78%"></div>
      <div class="sel" lang="es">Las plantas usan la luz del sol para convertir el agua y el dióxido de carbono en azúcar y oxígeno.</div>
      <div class="skel" style="width: 92%"></div>
      <div class="skel" style="width: 58%"></div>
    </div>
    <div class="panel">
      <div class="label"><span class="spark">✦</span> wisp</div>
      <div class="answer" data-answer>Plants use sunlight to turn water and carbon dioxide into sugar and oxygen.</div>
    </div>
  </div>
</main>
<script>
// Chip swings in, the page flies up in 3D, a crosshair drags the capture box,
// and the answer panel pops out of the selection while the answer streams in.
WispAnim.slide((k) => {
  k.punch();
  k.chipIn(0.02);
  k.fly3d(".page", 0.06, { rx: -34, y: -260 });
  const end = k.drag(".sel", 0.42, 0.32);
  k.panelIn(".panel", end + 0.04, { mode: "flipY", dur: 0.55 });
  k.stream(".answer", end + 0.2, 0.3);
});
</script>
</body>
</html>
