<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>07 rewrite</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
<style>
  .sel { font-size: 66px; text-wrap: balance; }
  .answer { font-size: 66px; text-wrap: balance; }
</style>
</head>
<body>
<main class="safe demo">
  <div class="chips"><span class="chip"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8l-3.8 1 1-3.8z"/></svg>Rewrite <kbd>⌃4</kbd></span><span class="pill">full version</span></div>
  <div class="stage">
    <div class="page">
      <div class="skel title" style="width: 48%"></div>
      <div class="skel" style="width: 96%"></div>
      <div class="skel" style="width: 74%"></div>
      <div class="sel">me and him was going to the store</div>
      <div class="skel" style="width: 88%"></div>
      <div class="skel" style="width: 52%"></div>
    </div>
    <div class="panel">
      <div class="label"><span class="spark">✦</span> wisp</div>
      <div class="answer" data-answer>He and I were going to the store.</div>
    </div>
  </div>
</main>
<script>
// Chip swings in, the page floats up in 3D, a crosshair drags the capture box,
// and the answer panel opens out of the selection while the answer streams in.
WispAnim.slide((k) => {
  k.punch();
  k.chipIn(0.02);
  k.fly3d(".page", 0.05, { ry: -10 });
  const bad = k.words(".sel").slice(0, 4); // "me and him was"
  bad.forEach((w) => Object.assign(w.style, { textDecorationLine: "underline", textDecorationStyle: "wavy", textDecorationThickness: "4px", textUnderlineOffset: "10px" }));
  k.stagger(bad, 0.26, 0.05, (w, t) => k.A(w, [{ textDecorationColor: "rgba(217,45,58,0)" }, { textDecorationColor: "rgba(217,45,58,1)" }], t, 0.2));
  const end = k.drag(".sel", 0.36, 0.28);
  k.panelIn(".panel", end + 0.04);
  const fixed = k.stream(".answer", end + 0.16, 0.18).slice(0, 4); // "He and I were"
  fixed.forEach((w) => Object.assign(w.style, { textDecorationLine: "underline", textDecorationThickness: "5px", textUnderlineOffset: "12px" }));
  k.stagger(fixed, end + 0.4, 0.05, (w, t) => k.A(w, [{ textDecorationColor: "rgba(173,145,255,0)" }, { textDecorationColor: "rgba(173,145,255,1)" }], t, 0.2));
});
</script>
</body>
</html>
