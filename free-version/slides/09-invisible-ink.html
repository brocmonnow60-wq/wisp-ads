<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>09 invisible ink</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
<style>
  .caption { font-size: 70px; }
</style>
</head>
<body>
<main class="safe demo">
  <div class="chips"><span class="chip solo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.9 3.8M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 19 12 19c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>Invisible Ink</span><span class="pill">full version</span></div>
  <div class="caption">no window, just faint text. grab&nbsp;it, drag it anywhere</div>
  <div class="stage">
    <div class="page ink-page">
      <div class="skel title" style="width: 58%"></div>
      <div class="skel" style="width: 100%"></div>
      <div class="skel" style="width: 82%"></div>
      <div class="sel">What's the difference between mitosis and meiosis?</div>
      <div class="ink" data-answer>Mitosis makes 2 identical cells for growth and repair. Meiosis makes 4 cells with half the chromosomes, which become eggs or sperm.<span class="ghost" data-overlay></span><svg class="hand" data-overlay viewBox="0 0 92 104" aria-hidden="true">
          <g fill="#15121D" stroke="#15121D" stroke-width="8" stroke-linejoin="round">
            <rect x="18" y="34" width="62" height="58" rx="22"/>
            <rect x="22" y="18" width="16" height="32" rx="8"/>
            <rect x="37" y="12" width="16" height="36" rx="8"/>
            <rect x="52" y="14" width="16" height="34" rx="8"/>
            <rect x="66" y="22" width="14" height="30" rx="7"/>
            <rect x="4" y="46" width="32" height="17" rx="8.5" transform="rotate(-32 20 54)"/>
          </g>
          <g fill="#FFFFFF">
            <rect x="18" y="34" width="62" height="58" rx="22"/>
            <rect x="22" y="18" width="16" height="32" rx="8"/>
            <rect x="37" y="12" width="16" height="36" rx="8"/>
            <rect x="52" y="14" width="16" height="34" rx="8"/>
            <rect x="66" y="22" width="14" height="30" rx="7"/>
            <rect x="4" y="46" width="32" height="17" rx="8.5" transform="rotate(-32 20 54)"/>
          </g>
          <g stroke="#15121D" stroke-width="3.5" stroke-linecap="round">
            <line x1="37.5" y1="24" x2="37.5" y2="40"/>
            <line x1="52.5" y1="20" x2="52.5" y2="40"/>
            <line x1="67" y1="26" x2="67" y2="42"/>
          </g>
        </svg></div>
      <div class="skel" style="width: 90%"></div>
      <div class="skel" style="width: 70%"></div>
    </div>
  </div>
</main>
<script>
// Chip swings in, the page floats up in 3D, a crosshair drags the capture box,
// and the answer panel opens out of the selection while the answer streams in.
WispAnim.slide((k) => {
  k.punch();
  k.chipIn(0.02);
  k.stagger(k.words(".caption", true), 0.1, 0.04, (w, t) => k.pop(w, t));
  k.fly3d(".page", 0.14);
  const end = k.drag(".sel", 0.46, 0.32);
  // the faint answer bleeds onto the page, then the hand grabs it and drags it into place
  k.A(".ink", [{ opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)" }], end + 0.04, 0.4, "out");
  const grab = end + 0.42;
  k.A(".ink", [{ transform: "translate(-110px, -12px)" }, { transform: "translate(0px, 0px)" }], grab + 0.08, 0.55, "inout");
  k.A(".hand", [{ transform: "scale(.5) rotate(-20deg)", opacity: 0 }, { opacity: 1, offset: 0.4 }, { transform: "scale(1) rotate(0deg)", opacity: 1 }], grab - 0.22, 0.3, "out");
  k.add(".hand", [{ transform: "scale(1) rotate(0deg)" }, { transform: "scale(.88) rotate(-6deg)" }], grab - 0.02, 0.12, "sine");
  k.add(".hand", [{ transform: "scale(1) rotate(0deg)" }, { transform: "scale(1.1364) rotate(6deg)" }], grab + 0.64, 0.16, "sine");
  k.A(".ink .ghost", [{ opacity: 0 }, { opacity: 1 }], grab - 0.12, 0.2);
});
</script>
</body>
</html>
