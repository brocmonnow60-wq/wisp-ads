<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10 works on anything</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
</head>
<body>
<main class="safe center">
  <div class="headline">works on anything</div>
  <div class="grid">
    <div class="tile">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      <span>PDFs</span>
    </div>
    <div class="tile">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M8 12.5v-2M12 12.5V8M16 12.5V9.5"/></svg>
      <span>slides</span>
    </div>
    <div class="tile">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path class="solid" d="M10 9.2v5.6l4.8-2.8z"/></svg>
      <span>videos</span>
    </div>
    <div class="tile wide">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6.5A2.5 2.5 0 0 1 6.5 4H8M16 4h1.5A2.5 2.5 0 0 1 20 6.5V8M20 16v1.5a2.5 2.5 0 0 1-2.5 2.5H16M8 20H6.5A2.5 2.5 0 0 1 4 17.5V16"/></svg>
      <span>screenshots</span>
    </div>
    <div class="tile">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></svg>
      <span>code</span>
    </div>
    <div class="tile full"><span>even text you can't select</span></div>
  </div>
</main>
<script>
// Headline pops, tiles flip up in 3D one by one, the last tile slams in.
WispAnim.slide((k) => {
  k.punch();
  k.stagger(k.words(".headline", true), 0, 0.07, (w, t, i) => k.pop(w, t, { from: 0.2, y: 60, rot: i ? 6 : -6 }));
  const tiles = k.$$(".tile:not(.full)");
  tiles.forEach((el) => (el.style.transformOrigin = "50% 100%"));
  k.stagger(tiles, 0.2, 0.07, (el, t) =>
    k.A(el, [{ transform: `${k.P(1200)} rotateX(-95deg) translateZ(-60px)`, opacity: 0 }, { opacity: 1, offset: 0.2 }, { transform: `${k.P(1200)} rotateX(0deg) translateZ(0px)`, opacity: 1 }], t, 0.55, "spring"));
  k.stagger(k.$$(".tile .icon"), 0.34, 0.07, (el, t) => k.pop(el, t, { from: 0, rot: -30 }));
  const full = k.$(".tile.full");
  k.slam(full, 0.6, { from: 1.6, dur: 0.22, blur: 8 });
  k.shake(".safe", 0.82, 10);
  k.shine(full, 0.8, 0.42);
  tiles.forEach((el, i) => k.idle(el, [{ transform: "rotateX(5deg) rotateY(-5deg)" }, { transform: "rotateX(-5deg) rotateY(5deg)" }], 1.4 + i * 0.25, 0.95));
});
</script>
</body>
</html>
