<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>11 pick your AI</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
</head>
<body>
<main class="safe center">
  <div class="headline">pick your AI</div>
  <div class="cards">
    <div class="card">
      <span class="well"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15.5" r="4.5"/><path d="M11.2 12.3 20 3.5M16.5 7l3 3M14.5 9l2 2"/></svg></span>
      <span class="txt"><span>Gemini <small>(free key)</small></span></span>
    </div>
    <div class="card">
      <span class="well"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 19h10.5a4.5 4.5 0 0 0 .6-8.96A6.5 6.5 0 0 0 5.6 8.6 5.2 5.2 0 0 0 7 19z"/></svg></span>
      <span class="txt"><span>OpenAI</span></span>
    </div>
    <div class="card">
      <span class="well"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="16" height="11" rx="2"/><path d="M2 19.5h20"/></svg></span>
      <span class="txt"><small>offline:</small><span>Ollama / LM Studio</span></span>
    </div>
  </div>
  <div class="private"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg><span><span class="v">private:</span> it only sees what you&nbsp;drag</span></div>
</main>
<script>
// Cards swing in from the right in 3D, icons pop, the lock clicks shut.
WispAnim.slide((k) => {
  k.punch();
  k.stagger(k.words(".headline", true), 0, 0.07, (w, t) => k.pop(w, t, { from: 0.2, y: 60 }));
  const cards = k.$$(".card");
  cards.forEach((c) => (c.style.transformOrigin = "100% 50%"));
  k.stagger(cards, 0.18, 0.1, (c, t) =>
    k.A(c, [{ transform: `${k.P(1400)} translateX(420px) rotateY(-70deg)`, opacity: 0 }, { opacity: 1, offset: 0.25 }, { transform: `${k.P(1400)} translateX(0px) rotateY(0deg)`, opacity: 1 }], t, 0.6, "spring"));
  k.stagger(k.$$(".card .well"), 0.34, 0.1, (w, t) => k.pop(w, t, { from: 0, rot: -45 }));
  k.rise(".private", 0.66, { y: 50 });
  k.A(".private .icon", [{ transform: "translateY(-16px) rotate(-18deg)" }, { transform: "none" }], 0.84, 0.36, "bouncy");
  cards.forEach((c, i) => k.idle(c, [{ transform: "rotateY(-3deg) rotateX(2deg)" }, { transform: "rotateY(3deg) rotateX(-2deg)" }], 1.8, 0.9 + i * 0.12));
});
</script>
</body>
</html>
