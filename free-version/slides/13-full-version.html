<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>13 full version</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
<style>
  .want { font-size: 136px; }
  .all { font-size: 300px; letter-spacing: -0.05em; line-height: 0.9; color: var(--violet); text-shadow: 0 0 100px rgba(173, 145, 255, 0.45); }
  .every { font-size: 84px; margin-top: 90px; line-height: 1.06; }
  .price { font-size: 116px; margin-top: 40px; }
</style>
</head>
<body>
<main class="safe center">
  <div class="h want">want it</div>
  <div class="h all">ALL?</div>
  <div class="h every">every mode + unlimited</div>
  <div class="h price">for <span class="v">$15</span> once</div>
</main>
<script>
// "want it" drops, a solid 3D ALL? slams in, the price stamps down, every mode orbits below.
WispAnim.slide((k) => {
  k.punch();
  k.stagger(k.words(".want", true), 0, 0.08, (w, t) => k.A(w, [{ transform: "translateY(-160px)", opacity: 0 }, { opacity: 1, offset: 0.3 }, { transform: "none", opacity: 1 }], t, 0.45, "bouncy"));
  const all = k.extrude(".all", { layers: 16, step: 2.4, from: "8d6cff", to: "1c1238" });
  k.showAt(all, 0.14);
  k.A(all, [{ transform: `${k.P(1200)} translateZ(700px) rotateX(60deg)` }, { transform: `${k.P(1200)} translateZ(0px) rotateX(0deg)` }], 0.14, 0.36, "spring");
  k.shake(".safe", 0.32, 20);
  k.idle(all, [{ transform: "rotateY(-12deg) rotateX(5deg)" }, { transform: "rotateY(12deg) rotateX(-4deg)" }], 1.3, 0.55);
  k.stagger(k.words(".every", true), 0.4, 0.05, (w, t) => k.pop(w, t, { from: 0.3, y: 40 }));
  k.A(".price", [{ transform: "scale(2.2) rotate(-10deg)", opacity: 0 }, { opacity: 1, offset: 0.3 }, { transform: "none", opacity: 1 }], 0.6, 0.34, "back");
  k.shake(".safe", 0.78, 10);
  // the six mode icons, orbiting in 3D under the price
  const icons = [
    '<path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h8A2.5 2.5 0 0 1 16 6.5v4a2.5 2.5 0 0 1-2.5 2.5H9l-3.5 3v-3A2.5 2.5 0 0 1 3 10.5z"/><path d="M16 9h2.5a2.5 2.5 0 0 1 2.5 2.5v4a2.5 2.5 0 0 1-2.5 2.5H18v3l-3.5-3h-3A2.5 2.5 0 0 1 9 15.5V15"/>',
    '<path d="M4 6h16M4 10h16M4 14h16M4 18h10"/>',
    '<path d="M5.5 3h13A2.5 2.5 0 0 1 21 5.5v9a2.5 2.5 0 0 1-2.5 2.5H15l-3 3.5L9 17H5.5A2.5 2.5 0 0 1 3 14.5v-9A2.5 2.5 0 0 1 5.5 3z"/><path d="M8.5 13.5 12 6l3.5 7.5M9.8 11h4.4"/>',
    '<path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8l-3.8 1 1-3.8z"/>',
    '<path d="M9 18h6M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.9 11.7c.6.5.9 1.1.9 1.8h6c0-.7.3-1.3.9-1.8A6.5 6.5 0 0 0 12 2.5z"/>',
    '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
  ];
  const stage = document.createElement("div");
  stage.dataset.deco = "";
  stage.style.cssText = "position:absolute;left:0;top:1330px;width:1080px;height:200px;perspective:1100px;pointer-events:none;";
  const spin = document.createElement("div");
  spin.style.cssText = "position:absolute;left:540px;top:100px;transform-style:preserve-3d;";
  stage.append(spin);
  icons.forEach((d, i) => {
    const it = document.createElement("div");
    it.style.cssText = `position:absolute;left:-58px;top:-58px;width:116px;height:116px;border-radius:32px;display:grid;place-items:center;background:#18171F;border:2px solid rgba(173,145,255,.55);box-shadow:0 0 40px rgba(173,145,255,.35);transform:rotateY(${i * 60}deg) translateZ(330px);color:#AD91FF;`;
    it.innerHTML = `<svg class="icon" viewBox="0 0 24 24" style="width:62px;height:62px;stroke-width:1.9">${d}</svg>`;
    spin.append(it);
  });
  document.body.append(stage);
  k.A(spin, [{ transform: "rotateX(-12deg) rotateY(0deg)" }, { transform: "rotateX(-12deg) rotateY(-360deg)" }], 0, 4, "linear", { iterations: Infinity });
  k.A(stage, [{ transform: "scale(0)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], 0.7, 0.5, "spring");
});
</script>
</body>
</html>
