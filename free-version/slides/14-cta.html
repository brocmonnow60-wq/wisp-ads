<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>14 cta</title>
<link rel="stylesheet" href="style.css">
<script src="anim.js"></script>
<style>
  .logo { width: 400px; height: 400px; filter: drop-shadow(0 0 80px rgba(173, 145, 255, 0.40)); }
  .word { font-size: 180px; margin-top: 40px; letter-spacing: -0.05em; }
  .url {
    margin-top: 60px;
    font-size: 76px;
    font-weight: 850;
    letter-spacing: -0.025em;
    line-height: 1;
    color: var(--bg);
    background: var(--violet);
    padding: 30px 52px;
    border-radius: 999px;
    box-shadow: 0 0 80px rgba(173, 145, 255, 0.35);
  }
  .comment { font-size: 72px; margin-top: 90px; line-height: 1.08; }
</style>
</head>
<body>
<main class="safe center">
  <img class="logo" src="icon.png" alt="">
  <div class="h word">wisp</div>
  <div class="url">wispformac.com</div>
  <div class="h comment">comment <span class="v">FREE</span><br>if you're trying&nbsp;it&nbsp;<span class="emoji">👇</span></div>
</main>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.min.js", "three/addons/": "../../node_modules/three/examples/jsm/" } }</script>
<script type="module">
// In anim mode the flat icon is swapped for the real 3D Wisp icon from wispformac.com.
if (WispAnim.enabled) WispAnim.wait((async () => {
  const { createWisp } = await import("./wisp3d.js");
  await document.fonts.ready;
  const logo = document.querySelector(".logo");
  const r = logo.getBoundingClientRect();
  const cy = r.top + r.height / 2;
  const cv = document.createElement("canvas");
  cv.dataset.deco = "";
  cv.style.cssText = `position:absolute;left:0;top:${cy - 570}px;width:1080px;height:1140px;pointer-events:none;`;
  document.body.insertBefore(cv, document.querySelector(".safe"));
  logo.style.visibility = "hidden";
  const wisp = createWisp(cv, { fit: 18.8, speed: 1.4, particles: 220 });
  WispAnim.onSeek((t) => wisp.render(t));
})());
</script>
<script>
// wisp drops in letter by letter, the URL pops with a shine, the 👇 bobs.
WispAnim.slide((k) => {
  k.punch();
  k.stagger(k.chars(".word"), 0.4, 0.07, (c, t) => {
    c.style.display = "inline-block";
    k.A(c, [{ transform: "translateY(-90px) rotate(-8deg)", opacity: 0 }, { opacity: 1, offset: 0.45 }, { transform: "translateY(0px) rotate(0deg)", opacity: 1 }], t, 0.6, "bouncy");
  });
  k.pop(".url", 0.68);
  k.shine(".url", 1.05, 0.65);
  k.stagger(k.words(".comment", true), 0.86, 0.06, (w, t) => k.pop(w, t));
  const hand = k.$(".comment .emoji");
  hand.style.display = "inline-block";
  k.idle(hand, ["translateY(-8px)", "translateY(8px)"], 0.9, 1.3);
});
</script>
</body>
</html>
